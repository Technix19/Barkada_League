name: Barkada League production API read-only smoke test
on:
  push:
    branches: [chore/release-backup-safety-20261104]
    paths: [.github/workflows/barkada-api-smoke.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate live Express API without writing data
        env:
          BARKADA_API_URL: https://barkada-league-api.onrender.com
        run: node server/scripts/smoke.mjs
